name: Publish to npm

# 只在 v* tag 上发布。workflow_dispatch 保留给"重跑一次 tag 构建"，
# 但下面第一步会校验 ref 必须是 tag —— 防止有人在任意分支上手动触发发版。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    # 环境审批闸门：在仓库 Settings → Environments 给 npm-publish 配 required reviewers 后，
    # 每次发布都需要人工批准（未配置时 GitHub 会自动创建该环境、无审批）。
    # 名称要与 npm 页面 Trusted Publisher 里填的 environment 一致。
    environment: npm-publish
    permissions:
      contents: write
      # Trusted Publishing（OIDC）交换令牌用；不写任何长期凭据
      id-token: write

    steps:
      - name: 校验触发来源（只允许 tag 发布）
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::发布工作流只允许通过 v* tag 触发（当前 ref: ${GITHUB_REF}）。请用 npm run release:push 或 git push --follow-tags。"
            exit 1
          fi
          echo "触发来源校验通过：${GITHUB_REF}"

      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          # Node 24 自带 npm ≥ 11.5.1，这是 Trusted Publishing 的硬性要求；
          # 刻意不写 registry-url：那会生成带 _authToken 的 .npmrc，让 npm 以为"认证已配好"从而不再走 OIDC。
          node-version: 24

      - name: 安装基础依赖
        run: npm install --ignore-scripts

      - name: 安装测试隔离依赖环境
        run: |
          npm run test:integration:setup
          npm run test:legacy:setup
          npm run test:stylelint17:setup

      - name: 执行全量测试套件 (门禁：测试全过才允许发布)
        run: npm run test:all

      - name: 检查发布文件清单 (防泄露测试/临时文件)
        run: npm pack --dry-run

      # 认证优先级：npm Trusted Publishing（OIDC）→ NPM_TOKEN。
      # 迁移路径：先在 npm 页面配置 Trusted Publisher，再删除仓库 secret NPM_TOKEN；
      # 删掉之后本步骤自动走 OIDC，不需要再改这个文件。
      # 始终显式带 --provenance：只有 OIDC 是"自动生成 provenance"，token 发布必须显式加这个
      # flag 才会有 attestation（npm 页面上的绿勾）。1.7.1 就是因为这里漏了 flag 而丢了绿勾。
      # 不再使用 `|| npm publish` 兜底：provenance 失败就应该失败，不能静默降级成无凭据发布。
      - name: 发布至 npm
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
            echo "使用 NPM_TOKEN 发布（已可切到 Trusted Publishing：配置后删除该 secret 即自动改走 OIDC）"
          else
            echo "未提供 NPM_TOKEN，使用 npm Trusted Publishing（OIDC）发布"
          fi

          # 不用 set -o pipefail：runner 的 bash -e 会让管线失败时直接中断，
          # 就看不到下面按退出码区分的两种失败原因了（发布失败 / 发布成功但没带 provenance）。
          npm publish --provenance --access public 2>&1 | tee "$PUBLISH_LOG"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::npm publish 退出码 ${status}，发布未完成（详见上方输出）。"
            exit 1
          fi

          # 立即自证（不依赖 registry 回传）：真正生成 provenance 时，npm 一定会打印这一行。
          # 1.7.1 就是漏了 --provenance：日志里没有这行，流程却全绿，只有 npm 页面少一个绿勾。
          if ! grep -q "Signed provenance statement" "$PUBLISH_LOG"; then
            echo "::error::npm publish 成功了，但输出里没有 provenance 签名信息（包已发布，npm 页面不会有绿勾）。确认发布命令带 --provenance、runner 有 id-token: write 权限。"
            exit 1
          fi
          grep "transparency log" "$PUBLISH_LOG" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_LOG: ${{ runner.temp }}/npm-publish.log

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # 防呆：发布后回查 attestation，确保绿勾真的在。
      # 放在最后，这样即使校验失败，包与 Release 也都已经建好，只是整条运行标红提醒。
      # 1.7.1 的教训：publish 命令漏掉 --provenance 时，流程全绿、只有 npm 页面少一个绿勾，
      # 不看一眼根本发现不了（这一层已由上面「发布至 npm」步骤的日志自证兜住）。
      #
      # 这里是 registry 侧的最终确认，必须给足耐心：registry 回传有延迟，实测 1.7.2 的
      # attestation 在发布后约 2 分钟才可查（透明日志签名时间 06:47:57Z，publish 结束于
      # 06:45:49Z），30 秒的预算会把「已经带 provenance」的发布误判成失败。
      # 预算：前 6 次每 10 秒，之后每 30 秒，共 16 次 ≈ 5.5 分钟；可用环境变量覆盖（便于本地验证）。
      - name: 校验 provenance 证明（npm 页面上的绿勾）
        run: |
          version=$(node -p "require('./package.json').version")
          url="https://registry.npmjs.org/-/npm/v1/attestations/my-code-style@${version}"
          max=${MAX_ATTEMPTS:-16}
          fast_attempts=${FAST_ATTEMPTS:-6}
          fast=${RETRY_FAST:-10}
          slow=${RETRY_SLOW:-30}
          start=$(date +%s)
          attempt=0
          code=000
          while [ "$attempt" -lt "$max" ]; do
            attempt=$((attempt + 1))
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "$url" || echo "000")
            waited=$(( $(date +%s) - start ))
            if [ "$code" = "200" ]; then
              echo "✅ my-code-style@${version} 已带 provenance 证明（等待 ${waited}s 后查到）"
              echo "   $url"
              exit 0
            fi
            if [ "$attempt" -lt "$max" ]; then
              if [ "$attempt" -le "$fast_attempts" ]; then delay=$fast; else delay=$slow; fi
              echo "第 ${attempt}/${max} 次查询：HTTP ${code}（已等 ${waited}s），${delay}s 后重试…"
              sleep "$delay"
            fi
          done
          echo "::error::等了 ${waited}s 仍查不到 my-code-style@${version} 的 attestation（最后一次 HTTP ${code}）。发布步骤已确认 npm 打印了 provenance 签名信息，因此这里多半只是 registry/CDN 还没回传；请稍后打开 ${url} 复核，若长期查不到再按 README《发布（维护者）》切到 Trusted Publishing。"
          exit 1
