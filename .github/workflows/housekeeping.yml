# 一次性收尾工作流：关闭已在 v1.9.0 交付的 issues + 清理遗留 Publish 运行记录。
# 触发条件：push 且提交信息含 [close-issues]（防止普通 push 误触发）。
# 权限来自仓库运行时 GITHUB_TOKEN（workflow permissions 声明），无需任何外部密钥。
# 收尾完成后本文件会被移除（见 chore 提交）。# 触发提交 [close-issues]

name: housekeeping

on:
    push:
        branches: [arena/01a0b214-codestyle]

permissions:
    issues: write
    actions: write

jobs:
    close-delivered-issues:
        if: contains(github.event.head_commit.message, '[close-issues]')
        runs-on: ubuntu-latest
        steps:
            - name: 关闭已交付 issues 并删除遗留 Publish 记录
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: myvn/codeStyle
              run: |
                  gh issue close 5 --comment "已在 my-code-style@1.9.0 修复（commit ece6d03）：默认 .prettierignore 纳入 pnpm-lock.yaml / yarn.lock / package-lock.json / npm-shrinkwrap.json / bun.lockb / bun.lock；已实测 prettier 对显式传入路径也尊重 ignore，lint-staged 场景有效。升级验证即可。"
                  gh issue close 6 --comment "已在 my-code-style@1.9.0 交付（commit fd3ac0d）：新增 npx my-code-style-doctor —— peer 按项目类型裁剪核对 + hooks 体检 + lockfile 入库检查 + 配置盘点，退出码 0/1 可直接做 CI 门禁。--install 暂不做（doctor 输出的一键补齐命令已覆盖该场景），有需要再开新 issue。"
                  gh issue close 7 --comment "已在 my-code-style@1.9.0 交付（commit f6f6fa7）：init 新增 --merge（别名 --no-overwrite）——已有配置与 hooks 一律保留、只补缺失文件；package.json 只新增缺失 scripts，已有 lint-staged 分组字段级保留。"
                  gh issue close 8 --comment "已在 my-code-style@1.9.0 交付（commit f6f6fa7）：init 收尾自动 hook 自检——存在 / 非空 / 可执行位 / lint-staged 与 commitlint 可解析 / .husky/_ 生效提示，只提示不阻断。dry-commit 全链探针暂缓（会在用户仓做真实提交，风险大于收益），有需要再开。"
                  gh issue close 9 --comment "已结：README 快速开始已点名 stylelint-order + 排障表新增 Could not find plugin 行（ece6d03）；catv 钉 ^12 的原因已在发版章节说明（7fa54f6）。更正：stylelint-order 本就在 peerDependencies 清单中（^6||^7||^8），init 依赖体检也会列出。"
                  gh api -X DELETE /repos/myvn/codeStyle/actions/runs/35495016623 &&
                      echo "遗留 Publish 记录已删除" ||
                      echo "35495016623 不存在或已删除，跳过"
                  echo "── 收尾完成 ──"
                  gh issue list --state open
